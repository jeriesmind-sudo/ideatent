name: Publish verified IdeaTent source

on:
  push:
    branches: [main]
    paths:
      - "ideatent-source-*.zip"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Overlay verified source
        shell: bash
        run: |
          archive="$(ls ideatent-source-*.zip | sort | tail -n 1)"
          mkdir .source-upload
          unzip -q "$archive" -d .source-upload
          rsync -a .source-upload/ ./
          rm -rf .source-upload "$archive"
          rm -f .github/workflows/unpack-source.yml
      - name: Commit source and remove this workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish verified IdeaTent source"
          git push
